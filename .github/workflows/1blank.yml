name: Unzip project to root

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          mkdir extract
          unzip -o *.zip -d extract

          # Если внутри ZIP есть папка Noderepkot-main,
          # переносим её содержимое в корень
          if [ -d "extract/Noderepkot-main" ]; then
            cp -a extract/Noderepkot-main/. .
          else
            cp -a extract/. .
          fi

          rm -rf extract
          rm -f *.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Noderepkot-main to root" || echo "Nothing to commit"
          git push
