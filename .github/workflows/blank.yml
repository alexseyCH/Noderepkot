name: Unzip project

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip to root
        run: |
          unzip -o Noderepkot-main.zip -d ./unzipped
          cp -r ./unzipped/* .
          rm -rf ./unzipped
          rm -f project.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip project to root" || echo "Nothing to commit"
          git push
